name: Deploy Sphinx Documentation to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master", depending on your repo

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./pkg
        run: uv sync --all-groups

      - name: Generate API stubs
        run: |
          uv run sphinx-apidoc -o doc/source pkg/rafts_algo/rafts_algo
          uv run sphinx-apidoc -o doc/source pkg/rafts_prep/rafts_prep

      - name: Build HTML
        working-directory: ./doc
        run: uv run make html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to where Sphinx outputs the HTML
          path: 'doc/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
