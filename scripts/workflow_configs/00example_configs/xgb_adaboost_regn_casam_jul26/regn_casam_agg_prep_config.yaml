# Prepare the Input attributes datasets from calibration for regionalization
col_schema:   # required column mappings in the input attributes dataset
  - 'gage_id': 'site_id' # The basin identifier/gage id used for each modeled location in the input dataset
  - 'featureID': '{gage_id}' # python f-string / R glue() format; converting the 'gage_id' to the standardized featureID used by nhdplusTools. Must use '{gage_id}' e.g. 'USGS-{gage_id}'
  - 'featureSource': 'hfv4_tempid' # The standardized nhdplusTools featureSource. Possible featureSources might be 'nwissite', 'comid', 'hfv22_id', hfv30_id
  - 'respvar_cols': "b|hydraulic_conductivity_1" # Column(s) in the dataset corresponding to the evaluation metrics. If multiple exist, separate each string by '|' e.g. 'rmse|kge|nse'
  - 'respvar_mappings': "b|hydraulic_conductivity_1" # OPTIONAL unless 'val_respvar' is True, which maps respvar_cols to the standardized format as specified in rafts_categories.yaml, separate each metric name by '|' e.g. 'RMSE|KGE|NSE'. When val_metrics is False (default), enter the same thing as respvar_cols.
  - 'val_respvar': 'False' # Should respvar_mappings be validated against the options in rafts_categories.yaml? Default False.
file_io: # May define {home_dir} for python's '{home_dir}/string_path'.format(home_dir =str(Path.home())) functionality
  - 'home_dir': '~' # OPTIONAL, define the home_dir path. If undefined, rafts_prep will automatically assume default '~' 
  - 'path_data': '{home_dir}/noaa/regionalization/data/raw/hfv4_vpu01_test26aug6_noFLV/sloth_noahowp_casam_selected_params.parquet' # Where the raw input data are stored.
  - 'data_source': 'hfATLAS_hf4' # The hydrofabricATLAS dataset version (may need to update with major version changes, or somehow integrate with dvc tracking)
  - 'dir_save': '{home_dir}/noaa/regionalization/data/input' # Required. The save location of standardized output
  - 'save_type': 'netcdf' #  Required. Save as hierarchical files 'netcdf' or 'zarr'. Default 'netcdf' until attribute 
  - 'save_loc': 'local' #  Required.  Use 'local' for saving to a local path via dir_save. Future work will create an approach for 'aws' or other cloud saving methods
  - 'path_hf_gpkg': "{home_dir}/noaa/regionalization/data/raw/hfv4_test/gpkg_jul26_hf4_manual_edits.gpkg" # The path to the gpkg containing the hfATLAS divides. This is required for mapping the divide_id to the standardized featureID and featureSource.
  - 'hf_divides_layer': "divides"         # The layer name inside the gpkg
  - 'map_divide_id_col': "gageID_divide_id"     # The column name in your metadata mapping CS
  # - 'hf_fp_layer': "flowpaths" # Hydrofabric layer name for flowpaths layer
  # - 'hf_fp_id_col': "flowpath_id" # The column name in the flowpaths layer corresponding to the flowpath outlet of the divide
  # - 'vpu_id_col': "vpuid" # The column name in the hydrofabric flowpaths layer
  - 'vpu_mapped': 'False' # Boolean str. Should output attribute data be organized by vpu? True recommended for large datasets, e.g. entire CONUS scale.
  - 'path_hf_basins_gpkg': "{home_dir}/noaa/regionalization/data/raw/hfv4_test/hfv4_fix/" # the path to the gpkg or dir of gpkgs containing the divide_ids as they correspond to basins of interest.
  # - 'gage_id_col_gpkg': #'gageID' # The gage_id column in the path_hf_basins_gpkg if present, otherwise do not provide and use gpkg_filename_pattern instead
  - 'gpkg_filename_pattern': "USGS-(.*)-ngen" # The pattern used to extract the gage_id (designated as *) from the .gpkg filenames contained inside path_hf_basins_gpkg (when it's a dir w/ many gpkg).   Default 'gage_{gage_id}.gpkg')
formulation_metadata:  
  - 'dataset_name': 'an_ex_xgb_casamnom' # Required. 
  - 'formulation_base': 'casamnom' # Required. Basename of formulation. the rr, sp, and gw will be added to this if 'formulation_id' is left empty
  - 'formulation_id':  # Optional alternative in lieu of generating a formulation_id based on 'formulation_base'. Should leave empty if automatic formulation_id generation desired.
  - 'formulation_ver': # Optional. The version of the formulation
  - 'temporal_res': '' # The temporal resolution corresponding to the modeled data
  - 'target_var': 'param' # Required. The target variable modeled. This is standardized. See target_var_mappings in rafts_categories.yaml
  - 'start_date': '2015-10-01' # Required. The YYYY-MM-DD start date corresponding to the evaluation metric's modeled timeseries
  - 'end_date':  '2023-09-30' # Required. The YYYY-MM-DD end date corresponding to the evaluation metric's modeled timeseries
  - 'modeled notes': 'A second round of calibration that removed some parameters, extended the calibration timeframe, and used hfv4'
  - 'cal_status': 'N' # Required. Was the formulation model fully calibrated? Options include 'Y','N', or 'S' (yes/no/somewhat)
  - 'start_date_cal': '2015-10-01' # The YYYY-MM-DD start date corresponding to the calibration period
  - 'end_date_cal': '2023-09-30' # The YYYY-MM-DD end date corresponding to the calibration period
  - 'cal_notes': "July 2026 CASAM-NOM calibration results using hfv4, processed by Lauren's ngen-fs output: iterations were selected using the dynamic multi objective function that assigns the remaining 0.3 weight to whichever metric was considered most informative out of: MAPPE, MPT, MP, FDC high flows and FDC middle section (if any. if none, all weight given to NNSE)"
references: # All optional but **very** helpful metadata
  - 'input_filepath': '{base_dir}/noaa/regionalization/data/raw/hfv4_vpu01_test26aug6_noFLV/sloth_noahowp_casam_selected_params.parquet'
  - 'source_url': 
  - 'dataset_doi': 'NA'
  - 'literature_doi': 'NA'
