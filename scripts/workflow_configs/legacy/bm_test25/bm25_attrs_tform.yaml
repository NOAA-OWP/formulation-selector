# Config for designing custom catchment attributes based on aggregation algorithms
#  This is an optional step in algo training and prediction, but must be performed if custom attributes desired.
#  Requires that the standard attributes first exist in a parquet file database, as generated by R package proc.attr.hydfab
#  If desired for algorithm training, custom attributes must be specified in the name_attr_csv file as defined in the algo config yaml file.
- file_io:
    - name_attr_config: 'bm25_attr_config.yaml' # REQUIRED. The filename of the attribute configuration file, expected to contain the dir_db_attrs: The parent dir where each comid's attribute parquet file is stored in the subdirectory 'comid/', and each dataset's aggregated parquet attributes are stored in the subdirectory '/{dataset_name}
    - path_comid:  # OPTIONAL. File path to the file containing comids. May be .parquet or .csv format. May be used separately in addition to the name_attr_config
    - colname_comid: 'featureID'  # Required only if specifying path_comid. The column name corresponding to the comid data in the `path_comid` file.
    - path_rafts_attrs_miss: '{home_dir}/git/rafts/pkg/proc.attr.hydfab/flow/rafts_attrs_miss.R' # OPTIONAL. If not present, will not attempt to retrieve missing comid-attribute pairings using the proc.attr.hydfab R package. Needs proc.attr.hydfab installed in order to work!
    - overwrite_tfrm: False # OPTIONAL, default False. Should the transformation attributes specified below overwrite existing attributes with the same name?
- transform_attrs:
  - 'ag_pc_use_{tform_type}':
    - tform_type: [sum]
    - var_desc: "The {tform_type} total percent agricultural land"
    - vars:
      - crp_pc_use
      - pst_pc_use
