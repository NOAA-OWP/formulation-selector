# hfatl_prep_config.yaml
# Ingest the hfATLAS gage-level predictor fixture for the 30-gage training subset of
# the hfATLAS integration test (test_rafts_hfatl_full_workflow.py), and register the
# divide-to-gage mapping used by rafts_agg_hfatl_basin.py to aggregate raw hfATLAS
# divide-level attributes up to gages.
col_schema:
  - 'gage_id': 'featureID' # tests/data/integ_test_predictors_x300.parquet is keyed by gage id in 'featureID'
  - 'featureID': '{gage_id}' # python f-string format. Must use '{gage_id}'
  - 'featureSource': 'hfv4_test_id'
  - 'respvar_cols': 'TOT_AET_hfa|TOT_CLAYAVE_hfa' # Example attribute columns (values unused; this step only registers metadata/geometry)
  - 'respvar_mappings': 'TOT_AET_hfa|TOT_CLAYAVE_hfa'
  - 'val_respvar': 'False'
file_io:
  - 'home_dir': '~'
  - 'path_data': '../../data/integ_test_predictors_x300.parquet' # Relative to this config file's directory
  - 'data_source': 'hfATLAS_hfv4'
  - 'dir_save': '../../data/run_data/input'
  - 'save_type': 'netcdf'
  - 'save_loc': 'local'
  - 'path_hf_basins_gpkg': '../../data/hfv4_x30.gpkg' # 30-gage / 1797-divide training subset
  - 'hf_divides_layer': 'divides'
  - 'map_divide_id_col': 'gageID_divide_id' # divide_id alone is not globally unique across gages in this GPKG
  - 'gage_id_col_gpkg': 'gageID_plain' # Plain (unprefixed) gage id, matching step 1's ingestion of integ_test_predictors_x300.parquet's 'featureID'
  - 'hf_fp_layer': 'divides' # hfv4_x30.gpkg has no separate flowpaths layer; reuse divides geometry
  - 'vpu_mapped': 'False'
formulation_metadata:
  - 'dataset_name': 'hfatl_test_x30' # Required. Unique per processing workflow.
  - 'formulation_base': 'hfatl_test'
  - 'formulation_id': # Optional. Left empty for automatic generation from formulation_base.
  - 'formulation_ver': # Optional.
  - 'temporal_res': ''
  - 'target_var': 'param'
  - 'start_date': '2015-10-01'
  - 'end_date': '2023-09-30'
  - 'cal_status': 'N'
